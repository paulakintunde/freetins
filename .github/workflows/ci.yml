name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate operational content
        run: pnpm check:data

      # The unit suites cover the validator, the content-only index gate, the
      # dataset loader and its display states, search and the code extractor.
      # They were never run here before; a rewrite of any of them was unenforced
      # until this step existed.
      - name: Run unit tests
        run: pnpm test

      # Vets every dataset page with the same checks the Astro loader runs, plus
      # live-path link checking. --strict refuses links to pages that have not
      # shipped, so a page can only cite what exists. Typed verification claims
      # are printed as an advisory queue and never fail the build.
      - name: Vet dataset pages
        run: pnpm check:content --strict

      # Fails on any term Step 1a of the Confirmation Ledger retired, outside the
      # allow list and the marked lines in scripts/check-vocabulary.mjs. Terms
      # scheduled for a later step (the article review fields, Step 1b) are
      # reported and never fatal. See docs/TESTING.md.
      - name: Check retired vocabulary
        run: pnpm check:vocabulary --strict

      - name: Build
        run: pnpm build

      - name: Crawl internal routes
        run: pnpm check:routes
