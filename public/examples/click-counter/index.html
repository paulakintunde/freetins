<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Click counter coding example</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f2efe7;
        color: #17201b;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      .counter-card {
        width: min(32rem, calc(100% - 3rem));
        padding: 3rem;
        border: 1px solid #839487;
        border-radius: 1rem;
        background: #fffdf7;
        box-shadow: 0 1.25rem 3rem rgb(23 32 27 / 12%);
        text-align: center;
      }

      .label {
        margin: 0;
        color: #526057;
        font-family: "Trebuchet MS", sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      output {
        display: block;
        margin: 0.4rem 0 1.75rem;
        font-size: clamp(4rem, 15vw, 7rem);
        line-height: 1;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      button {
        min-width: 8rem;
        padding: 0.8rem 1rem;
        border: 2px solid #1c5138;
        border-radius: 999px;
        background: #1c5138;
        color: white;
        font: 700 1rem/1 "Trebuchet MS", sans-serif;
        cursor: pointer;
      }

      button:last-child {
        background: transparent;
        color: #1c5138;
      }

      button:focus-visible {
        outline: 3px solid #d88924;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="counter-card">
      <h1 class="label">Current count</h1>
      <output id="count" aria-live="polite">0</output>

      <div class="actions">
        <button id="add" type="button">Add one</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>

    <script>
      const countOutput = document.querySelector('#count');
      const addButton = document.querySelector('#add');
      const resetButton = document.querySelector('#reset');
      const increment = 1;
      let count = 0;

      function render() {
        countOutput.textContent = String(count);
      }

      addButton.addEventListener('click', () => {
        count += increment;
        render();
      });

      resetButton.addEventListener('click', () => {
        count = 0;
        render();
      });

      render();
    </script>
  </body>
</html>
