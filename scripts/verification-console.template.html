<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Freetins verification console</title>
<style>
  :root {
    --bg: #0d100e; --panel: #151a17; --raised: #1c2320; --line: #2a332e;
    --text: #e8ede9; --dim: #96a29a; --faint: #6b7a72;
    --green: #2f9e5f; --green-dim: #1d5f3a; --red: #c0392b; --amber: #b8860b;
    --mono: "Cascadia Mono", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .01em; }
  header .stat { color: var(--dim); font-size: 13px; }
  header .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; height: calc(100vh - 57px); }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; height: auto; } }
  .col { overflow-y: auto; padding: 14px; }
  .col + .col { border-left: 1px solid var(--line); }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

  .game { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px;
    border: 1px solid transparent; border-radius: 5px; background: none; color: var(--text);
    font: inherit; text-align: left; cursor: pointer; }
  .game:hover { background: var(--raised); }
  .game[aria-current="true"] { background: var(--raised); border-color: var(--line); }
  .game .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .dot.part { background: var(--amber); }
  .dot.done { background: var(--green); }
  .dot.fail { background: var(--red); }

  .code { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 8px; background: var(--panel); }
  .code.pass { border-color: var(--green-dim); }
  .code.fail { border-color: #5a2a24; }
  .code .txt { min-width: 0; }
  .code .str { font-family: var(--mono); font-size: 13px; color: #7fe0a5; word-break: break-all; }
  .code.fail .str { color: #e59a92; }
  .code .meta { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .code .id { color: var(--faint); font-size: 11px; font-family: var(--mono); }
  .seg { display: flex; gap: 0; flex: none; }
  .seg button { padding: 5px 11px; border: 1px solid var(--line); background: var(--raised);
    color: var(--dim); font: 600 12px/1 inherit; cursor: pointer; }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child { border-radius: 0 4px 4px 0; border-left: 0; }
  .seg button[aria-pressed="true"] { color: #fff; }
  .seg button.y[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
  .seg button.n[aria-pressed="true"] { background: var(--red); border-color: var(--red); }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button.act { padding: 7px 13px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--raised); color: var(--text); font: 600 13px/1 inherit; cursor: pointer; }
  button.act:hover { border-color: var(--faint); }
  button.act.pri { background: var(--green); border-color: var(--green); color: #fff; }
  button.act.danger { color: #e59a92; }
  select, input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--raised); color: var(--text); font: inherit; font-size: 13px; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 8px 0 3px; }

  .session { border: 1px solid var(--line); border-radius: 5px; padding: 11px; margin-bottom: 10px; background: var(--panel); }
  .session .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .session .hd strong { font-size: 13px; }
  .session .count { color: var(--faint); font-size: 12px; }

  pre { margin: 0; padding: 11px; border: 1px solid var(--line); border-radius: 5px;
    background: #0a0d0b; color: #cfe6d8; font-family: var(--mono); font-size: 11.5px;
    max-height: 340px; overflow: auto; white-space: pre; }
  .note { color: var(--dim); font-size: 12.5px; margin: 10px 0; }
  .warn { border-left: 3px solid var(--amber); padding-left: 10px; color: #e2c98a; }
  .empty { color: var(--faint); padding: 30px 6px; text-align: center; }
  code.k { font-family: var(--mono); font-size: 12px; color: #9ad8b4; }
</style>
</head>
<body>

<header>
  <h1>Verification console</h1>
  <span class="stat"><b id="s-done">0</b> / <b id="s-total">0</b> codes marked</span>
  <span class="stat"><b id="s-games">0</b> games touched</span>
  <span class="stat" id="s-saved">saved locally</span>
</header>

<div class="layout">

  <div class="col">
    <h2>Games <span id="g-count"></span></h2>
    <div id="games"></div>
  </div>

  <div class="col">
    <div id="detail"><div class="empty">Pick a game on the left.</div></div>
  </div>

  <div class="col">
    <h2>Days worked</h2>
    <div id="sessions"></div>
    <button class="act" id="add-day">Add a day</button>

    <h2 style="margin-top:22px">Export</h2>
    <p class="note">This is the exact file <code class="k">pnpm record:checks</code> reads. Save it as
      <code class="k">src/content/verification-log.json</code>, or send it to the agent.</p>
    <div class="bar">
      <button class="act pri" id="copy">Copy JSON</button>
      <button class="act" id="download">Download .json</button>
      <button class="act" id="download-md">Download .md</button>
    </div>
    <div id="export-warn"></div>
    <pre id="out">{}</pre>

    <h2 style="margin-top:22px">Reset</h2>
    <button class="act danger" id="reset">Clear everything</button>
  </div>

</div>

<script>
const DATA = __QUEUE_DATA__;
const KEY = 'freetins-verification-console-v1';

const blank = () => ({
  checkedBy: 'paul-a',
  method: 'redeemed',
  cadence: { minutesPerCode: 1, minutesBetweenGames: 12 },
  sessions: [],        // [{id, startedAt}]
  assign: {},          // gameSlug -> sessionId
  order: [],           // gameSlug[] in the order they were assigned
  marks: {},           // entryId -> 'pass' | 'fail'
});

let state = load();
let current = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    return Object.assign(blank(), JSON.parse(raw));
  } catch { return blank(); }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    document.getElementById('s-saved').textContent = 'saved locally';
  } catch {
    document.getElementById('s-saved').textContent = 'could not save - export before closing';
  }
}

const el = (tag, props = {}, kids = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of [].concat(kids)) node.append(kid);
  return node;
};
const gameState = (game) => {
  const marks = game.entries.map((entry) => state.marks[entry.id]);
  if (marks.some((mark) => mark === 'fail')) return 'fail';
  if (marks.every((mark) => mark === 'pass')) return 'done';
  if (marks.some(Boolean)) return 'part';
  return 'none';
};

function renderGames() {
  const host = document.getElementById('games');
  host.textContent = '';
  for (const game of DATA.games) {
    const status = gameState(game);
    const button = el('button', {
      className: 'game',
      onclick: () => { current = game.slug; render(); },
    }, [
      el('span', { className: 'dot ' + (status === 'none' ? '' : status) }),
      el('span', { className: 'name', textContent: game.name }),
      el('span', { className: 'n', textContent: String(game.entries.length) }),
    ]);
    // Node.append returns undefined, so the attribute goes on before the append.
    button.setAttribute('aria-current', String(game.slug === current));
    host.append(button);
  }
  document.getElementById('g-count').textContent = '(' + DATA.games.length + ')';
}

function mark(entryId, value) {
  if (state.marks[entryId] === value) delete state.marks[entryId];
  else state.marks[entryId] = value;
  save(); render();
}

function renderDetail() {
  const host = document.getElementById('detail');
  host.textContent = '';
  const game = DATA.games.find((item) => item.slug === current);
  if (!game) { host.append(el('div', { className: 'empty', textContent: 'Pick a game on the left.' })); return; }

  host.append(el('h2', { textContent: game.name + '  ·  /codes/' + game.slug + '/' }));

  const bar = el('div', { className: 'bar' });
  bar.append(el('button', {
    className: 'act pri', textContent: 'All ' + game.entries.length + ' redeemed',
    onclick: () => { for (const entry of game.entries) state.marks[entry.id] = 'pass'; save(); render(); },
  }));
  bar.append(el('button', {
    className: 'act', textContent: 'Clear this game',
    onclick: () => { for (const entry of game.entries) delete state.marks[entry.id]; save(); render(); },
  }));

  const pick = el('select', {
    onchange: (event) => {
      const value = event.target.value;
      if (value) {
        state.assign[game.slug] = value;
        if (!state.order.includes(game.slug)) state.order.push(game.slug);
      } else {
        delete state.assign[game.slug];
        state.order = state.order.filter((slug) => slug !== game.slug);
      }
      save(); render();
    },
  });
  pick.append(el('option', { value: '', textContent: 'not assigned to a day' }));
  state.sessions.forEach((session, index) => {
    const option = el('option', { value: session.id, textContent: 'Day ' + (index + 1) + (session.startedAt ? ' · ' + session.startedAt.slice(0, 10) : '') });
    if (state.assign[game.slug] === session.id) option.selected = true;
    pick.append(option);
  });
  bar.append(pick);
  host.append(bar);

  for (const entry of game.entries) {
    const status = state.marks[entry.id];
    const row = el('div', { className: 'code' + (status ? ' ' + status : '') });
    row.append(el('div', { className: 'txt' }, [
      el('div', { className: 'str', textContent: entry.code }),
      el('div', { className: 'meta', textContent: entry.reward + '  ·  ' + entry.source }),
      el('div', { className: 'id', textContent: entry.id }),
    ]));
    const seg = el('div', { className: 'seg' });
    const yes = el('button', { className: 'y', textContent: 'Redeemed', onclick: () => mark(entry.id, 'pass') });
    const no = el('button', { className: 'n', textContent: 'Failed', onclick: () => mark(entry.id, 'fail') });
    yes.setAttribute('aria-pressed', String(status === 'pass'));
    no.setAttribute('aria-pressed', String(status === 'fail'));
    seg.append(yes, no);
    row.append(seg);
    host.append(row);
  }
}

function renderSessions() {
  const host = document.getElementById('sessions');
  host.textContent = '';
  if (state.sessions.length === 0) {
    host.append(el('p', { className: 'note', textContent: 'No days yet. Add one, set when you sat down, then assign games to it.' }));
  }
  state.sessions.forEach((session, index) => {
    const assigned = Object.entries(state.assign).filter(([, id]) => id === session.id).length;
    const box = el('div', { className: 'session' });
    const head = el('div', { className: 'hd' }, [
      el('strong', { textContent: 'Day ' + (index + 1) }),
      el('span', { className: 'count', textContent: assigned + ' game' + (assigned === 1 ? '' : 's') }),
    ]);
    head.append(el('button', {
      className: 'act danger', textContent: 'Remove', style: 'padding:3px 8px;font-size:12px',
      onclick: () => {
        state.sessions = state.sessions.filter((item) => item.id !== session.id);
        for (const [slug, id] of Object.entries(state.assign)) if (id === session.id) delete state.assign[slug];
        save(); render();
      },
    }));
    box.append(head);
    box.append(el('label', { textContent: 'Started (your local time)' }));
    const input = el('input', { type: 'datetime-local', value: session.local || '' });
    input.addEventListener('change', (event) => {
      session.local = event.target.value;
      session.startedAt = event.target.value ? new Date(event.target.value).toISOString().replace(/\.\d{3}Z$/, 'Z') : '';
      save(); render();
    });
    box.append(input);
    if (session.startedAt) box.append(el('div', { className: 'note', textContent: 'UTC: ' + session.startedAt }));
    host.append(box);
  });

  const who = el('div');
  who.append(el('label', { textContent: 'Editor id' }));
  const whoInput = el('input', { value: state.checkedBy });
  whoInput.addEventListener('change', (event) => { state.checkedBy = event.target.value.trim(); save(); render(); });
  who.append(whoInput);
  who.append(el('label', { textContent: 'Minutes per code / between games' }));
  const perCode = el('input', { type: 'number', min: '0.1', step: '0.1', value: String(state.cadence.minutesPerCode), style: 'width:70px' });
  const between = el('input', { type: 'number', min: '0', step: '1', value: String(state.cadence.minutesBetweenGames), style: 'width:70px;margin-left:6px' });
  perCode.addEventListener('change', (event) => { state.cadence.minutesPerCode = Number(event.target.value); save(); render(); });
  between.addEventListener('change', (event) => { state.cadence.minutesBetweenGames = Number(event.target.value); save(); render(); });
  const pair = el('div'); pair.append(perCode, between); who.append(pair);
  host.append(who);
}

/*
 * The export is the recorder's own format, not a new one.
 *
 * A game where every outstanding code redeemed goes in as a `games` entry, which
 * is what lets the recorder expand it and derive one timestamp per page. A game
 * with any failure cannot use that shape, so its passes and its failures are
 * written as explicit `entryIds` blocks against the same start time. A game with
 * some codes still unmarked is left out entirely: half a page is not a result.
 */
function buildLog() {
  const warnings = [];
  const sessions = [];

  state.sessions.forEach((session, index) => {
    const slugs = state.order.filter((slug) => state.assign[slug] === session.id);
    if (slugs.length === 0) return;
    if (!session.startedAt) { warnings.push('Day ' + (index + 1) + ' has games but no start time.'); return; }

    const whole = [];
    const passes = [];
    const failures = [];
    for (const slug of slugs) {
      const game = DATA.games.find((item) => item.slug === slug);
      const marks = game.entries.map((entry) => ({ entry, mark: state.marks[entry.id] }));
      if (marks.some((row) => !row.mark)) {
        warnings.push(game.name + ' has ' + marks.filter((row) => !row.mark).length + ' code(s) not marked - left out.');
        continue;
      }
      if (marks.every((row) => row.mark === 'pass')) { whole.push(slug); continue; }
      for (const row of marks) (row.mark === 'pass' ? passes : failures).push(row.entry.id);
    }

    if (whole.length) {
      sessions.push({ startedAt: session.startedAt, checkedBy: state.checkedBy, method: state.method, result: 'accepted', games: whole });
    }
    if (passes.length) {
      sessions.push({ checkedAt: session.startedAt, checkedBy: state.checkedBy, method: state.method, result: 'accepted', entryIds: passes });
    }
    if (failures.length) {
      sessions.push({ checkedAt: session.startedAt, checkedBy: state.checkedBy, method: state.method, result: 'rejected', entryIds: failures });
    }
  });

  const unassigned = DATA.games.filter((game) => game.entries.some((entry) => state.marks[entry.id]) && !state.assign[game.slug]);
  for (const game of unassigned) warnings.push(game.name + ' is marked but not assigned to a day.');

  return { log: { cadence: state.cadence, sessions }, warnings };
}

function toMarkdown(log) {
  const lines = ['# Verification pass', '', 'Editor: ' + state.checkedBy + '  ·  method: ' + state.method, ''];
  log.sessions.forEach((session, index) => {
    const at = session.startedAt || session.checkedAt;
    lines.push('## Block ' + (index + 1) + ' — ' + at + ' — ' + session.result);
    if (session.games) {
      lines.push('', 'Whole pages, in the order worked:', '');
      for (const slug of session.games) {
        const game = DATA.games.find((item) => item.slug === slug);
        lines.push('- ' + game.name + ' (`' + slug + '`) — ' + game.entries.length + ' codes');
      }
    } else {
      lines.push('', 'Individual entries:', '');
      for (const id of session.entryIds) lines.push('- `' + id + '`');
    }
    lines.push('');
  });
  lines.push('---', '', 'Paste the JSON below into `src/content/verification-log.json` and run `pnpm record:checks --dry-run`.', '',
    '```json', JSON.stringify(log, null, 2), '```', '');
  return lines.join('\n');
}

function renderExport() {
  const { log, warnings } = buildLog();
  document.getElementById('out').textContent = JSON.stringify(log, null, 2);
  const host = document.getElementById('export-warn');
  host.textContent = '';
  if (warnings.length) {
    host.append(el('div', { className: 'note warn' }, warnings.map((text) => el('div', { textContent: text }))));
  }
  return log;
}

function saveFile(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const link = el('a', { href: url, download: name });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function render() {
  renderGames(); renderDetail(); renderSessions();
  const log = renderExport();
  const marked = Object.keys(state.marks).length;
  document.getElementById('s-done').textContent = String(marked);
  document.getElementById('s-total').textContent = String(DATA.totalEntries);
  document.getElementById('s-games').textContent = String(DATA.games.filter((game) => gameState(game) !== 'none').length);
  window.__log = log;
}

document.getElementById('add-day').onclick = () => {
  state.sessions.push({ id: 'd' + Date.now().toString(36), startedAt: '', local: '' });
  save(); render();
};
document.getElementById('copy').onclick = async () => {
  const text = JSON.stringify(buildLog().log, null, 2);
  try { await navigator.clipboard.writeText(text); document.getElementById('copy').textContent = 'Copied'; }
  catch { document.getElementById('copy').textContent = 'Select the JSON below and copy'; }
  setTimeout(() => { document.getElementById('copy').textContent = 'Copy JSON'; }, 1600);
};
document.getElementById('download').onclick = () => saveFile('verification-log.json', JSON.stringify(buildLog().log, null, 2), 'application/json');
document.getElementById('download-md').onclick = () => saveFile('verification-pass.md', toMarkdown(buildLog().log), 'text/markdown');
document.getElementById('reset').onclick = () => {
  if (!confirm('Clear every mark, day and assignment on this device?')) return;
  state = blank(); current = null; save(); render();
};

render();
</script>
</body>
</html>
